# The Node/Express app. Image is built locally from agent/Dockerfile and
# loaded into minikube's node directly (no registry needed) — see k8s/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: devops-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: agent }
  template:
    metadata:
      labels: { app: agent }
    spec:
      containers:
        - name: agent
          image: devops-agent:local
          imagePullPolicy: IfNotPresent # image is loaded directly into the node, never pulled from a registry
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: devops-agent-config }
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef: { name: devops-agent-secret, key: GITHUB_TOKEN }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: devops-agent-secret, key: DATABASE_URL }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: devops-agent
spec:
  type: NodePort # `minikube service agent -n devops-agent --url` prints a reachable URL
  selector: { app: agent }
  ports:
    - port: 3000
      targetPort: 3000
