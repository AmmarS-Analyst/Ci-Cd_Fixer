# Non-secret config, equivalent to the non-GITHUB_TOKEN lines in .env.example.
# GITHUB_TOKEN and POSTGRES_PASSWORD live in secret.yaml instead — never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-agent-config
  namespace: devops-agent
data:
  OLLAMA_URL: "http://ollama:11434"
  OLLAMA_MODEL: "qwen2.5-coder:7b"
  OLLAMA_TIMEOUT_MS: "600000"
  OLLAMA_MAX_LOG_CHARS: "3000"
  GITHUB_OWNER: "your-github-username"
  GITHUB_REPO: "your-repo-name"
  CONFIDENCE_THRESHOLD: "70"
  MAX_RETRIES: "2"
  COST_CEILING_USD: "0.05"
  COST_PER_1K_PROMPT_TOKENS_USD: "0.00015"
  COST_PER_1K_COMPLETION_TOKENS_USD: "0.0006"
  DRY_RUN: "true"
  PORT: "3000"
