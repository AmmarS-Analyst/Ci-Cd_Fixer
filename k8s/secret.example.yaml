# Template for the real secret. Copy this file to secret.yaml (gitignored,
# same as .env), fill in real values, and `kubectl apply -f k8s/secret.yaml`.
# Never commit secret.yaml.
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # edit k8s/secret.yaml with your real token/password
#   kubectl apply -f k8s/secret.yaml
#
# DATABASE_URL's password must match POSTGRES_PASSWORD below — they're
# separate keys here (rather than composed at deploy time) because Kubernetes
# only expands $(VAR) references between env vars declared directly on a
# container's `env:` list, not through envFrom — simplest to just keep them
# in sync by hand in this one file.
apiVersion: v1
kind: Secret
metadata:
  name: devops-agent-secret
  namespace: devops-agent
type: Opaque
stringData:
  GITHUB_TOKEN: "ghp_xxx_your_personal_access_token"
  POSTGRES_PASSWORD: "postgres"
  DATABASE_URL: "postgres://postgres:postgres@postgres:5432/agent"
